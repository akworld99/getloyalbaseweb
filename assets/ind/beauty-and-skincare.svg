<path class="tw" d="M80 62 Q81.8 70.2 90 72 Q81.8 73.8 80 82 Q78.2 73.8 70 72 Q78.2 70.2 80 62Z" fill="#FFFFFF"/><path class="tw2" d="M64 106 Q65.08 110.92 70 112 Q65.08 113.08 64 118 Q62.92 113.08 58 112 Q62.92 110.92 64 106Z" fill="#FFFFFF"/><path class="tw2" d="M356 143 Q357.26 148.74 363 150 Q357.26 151.26 356 157 Q354.74 151.26 349 150 Q354.74 148.74 356 143Z" fill="#FFFFFF"/>

