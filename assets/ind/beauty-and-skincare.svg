<rect x="252" y="150" width="78" height="58" rx="14" fill="#FFFFFF"/>
<rect x="248" y="138" width="86" height="20" rx="8" fill="#F57FA0"/>
<rect x="266" y="168" width="50" height="22" rx="5" fill="#FDE8EF"/>
